services:
  - type: web
    name: campus-care-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-care-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INTEGRATION_API_KEY
        generateValue: true

databases:
  - name: campus-care-db
    plan: basic-256mb
    databaseName: campuscare
    user: campuscare_user
